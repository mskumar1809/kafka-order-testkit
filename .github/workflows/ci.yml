name: ci

on:
  push:
  pull_request:

env:
  UV_FROZEN: "1"  # use uv.lock exactly; fail instead of silently re-resolving

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make lint
      - run: make test-unit

  python-integration:
    runs-on: ubuntu-latest  # Docker is preinstalled, which is all Testcontainers needs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make test-integration

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
        working-directory: streams-positions

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Short run at a lower rate; shared runners are noisier than a laptop, so the p99 gate
      # here is looser and exists to catch gross regressions. k6 runs from its Docker image.
      - run: make perf RATE=200 DURATION=20s P99_MS=50
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200 api processor
      - name: Tear down
        if: always()
        run: make down
